# Stack completo para o SERVIDOR: PostgreSQL + API/site num container.
#   1) copie .env.example para .env e defina QUESTPRO_API_KEY e QUESTPRO_DB_PASSWORD
#   2) docker compose up -d --build
#   3) site + API em http://<ip-do-servidor>:${QUESTPRO_HTTP_PORT:-8000}
# Nome fixo do projeto: mantém os volumes (questpro-eyetracking-web_pgdata/_media) iguais aos
# de antes da unificação no monorepo, quando o compose rodava numa pasta com esse nome.
name: questpro-eyetracking-web

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: questpro
      POSTGRES_PASSWORD: ${QUESTPRO_DB_PASSWORD:-questpro}
      POSTGRES_DB: questpro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questpro"]
      interval: 5s
      timeout: 3s
      retries: 20
    # sem "ports": o Postgres fica acessível só dentro da rede do compose (mais seguro).
    # p/ debugar de fora, descomente:
    # ports: ["5432:5432"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUESTPRO_DB_URL: postgresql+psycopg://questpro:${QUESTPRO_DB_PASSWORD:-questpro}@db:5432/questpro
      QUESTPRO_API_KEY: ${QUESTPRO_API_KEY:-}
      # Login do site e e-mails (convite, redefinição de senha); ver o .env.example.
      # O endereço do site entra nos links: no servidor, use o IP ou o domínio de verdade.
      QUESTPRO_PUBLIC_BASE_URL: ${QUESTPRO_PUBLIC_BASE_URL:-http://localhost:${QUESTPRO_HTTP_PORT:-8000}}
      QUESTPRO_SECRET_KEY: ${QUESTPRO_SECRET_KEY:-}
      # Chave que o óculos (e o simulador) manda para se conectar (execução ao vivo).
      QUESTPRO_DEVICE_KEY: ${QUESTPRO_DEVICE_KEY:-}
      QUESTPRO_COOKIE_SECURE: ${QUESTPRO_COOKIE_SECURE:-false}
      QUESTPRO_SMTP_HOST: ${QUESTPRO_SMTP_HOST:-}
      QUESTPRO_SMTP_PORT: ${QUESTPRO_SMTP_PORT:-587}
      QUESTPRO_SMTP_USER: ${QUESTPRO_SMTP_USER:-}
      QUESTPRO_SMTP_PASSWORD: ${QUESTPRO_SMTP_PASSWORD:-}
      QUESTPRO_SMTP_FROM: "${QUESTPRO_SMTP_FROM:-NeuroSight <nao-responda@neurosight.local>}"
      QUESTPRO_SMTP_SECURITY: ${QUESTPRO_SMTP_SECURITY:-starttls}
    volumes:
      - media:/data/media
    ports:
      - "${QUESTPRO_HTTP_PORT:-8000}:8000"

volumes:
  pgdata:
  media:
