# Alembic pela linha de comando, a partir de web/backend:
#   alembic upgrade head        aplica as migrações (a API também faz isso ao subir)
#   alembic stamp 0001_baseline marca um banco anterior ao Alembic como já estando na baseline
#   alembic revision --autogenerate -m "descrição"
# A URL do banco vem de QUESTPRO_DB_URL (app/config.py), não deste arquivo.

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
